[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "passforge"
version = "1.0.0"
description = "High-Entropy Password, Diceware Passphrase & Crypto Token Generator CLI"
readme = "README.md"
authors = [
  { name = "Moch. Erik Irriansyah", email = "erik@narotama.ac.id" }
]
license = { text = "MIT" }
keywords = ["password", "generator", "diceware", "crypto", "token", "security", "cli"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]
requires-python = ">=3.8"
dependencies = []

[project.scripts]
passforge = "passforge.cli:main"

[project.urls]
Homepage = "https://github.com/MochErik/passforge"
Repository = "https://github.com/MochErik/passforge.git"
Issues = "https://github.com/MochErik/passforge/issues"
